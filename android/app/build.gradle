plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aiku.daemon'
    compileSdk 34

    defaultConfig {
        applicationId "com.aiku.daemon"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0.0"
    }

    androidResources {
        noCompress 'txt', 'dat', 'json', 'yaml', 'env', 'so'
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
            storePassword System.getenv("KEYSTORE_STORE_PASSWORD") ?: "aikusecret"
            keyAlias System.getenv("KEYSTORE_KEY_ALIAS") ?: "aikukey"
            keyPassword System.getenv("KEYSTORE_KEY_PASSWORD") ?: "aikusecret"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {}
