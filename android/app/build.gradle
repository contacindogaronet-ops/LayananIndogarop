plugins {
    id 'com.android.application'
}

def autoVersionCode = Integer.parseInt(System.getenv("VERSION_CODE") ?: "100")
def autoVersionName = System.getenv("VERSION_NAME") ?: "1.0.${autoVersionCode}"

android {
    namespace 'com.aiku.daemon'
    compileSdk 34

    defaultConfig {
        applicationId "com.aiku.daemon"
        minSdk 21
        targetSdk 28
        versionCode autoVersionCode
        versionName autoVersionName
    }

    androidResources {
        noCompress 'txt', 'dat', 'json', 'yaml', 'env', 'so'
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
            storePassword System.getenv("KEYSTORE_STORE_PASSWORD") ?: "aikurelease2026"
            keyAlias System.getenv("KEYSTORE_KEY_ALIAS") ?: "aikukey"
            keyPassword System.getenv("KEYSTORE_KEY_PASSWORD") ?: "aikurelease2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
