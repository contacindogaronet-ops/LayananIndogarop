plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aiku.daemon'
    compileSdk 34

    defaultConfig {
        applicationId "com.aiku.daemon"
        minSdk 21
        targetSdk 28 // Wajib 28 agar Android 10-14 mengizinkan eksekusi binary langsung dari filesDir
        versionCode 1
        versionName "1.0.0"
    }

    androidResources {
        noCompress 'txt', 'dat', 'json', 'yaml', 'env', 'so'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {}
