name: "Build Standalone Installable APK"

on:
  push:
    branches:
      - "master"
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
      - "main"

jobs:
  build-apk:
    name: "Compile Go Core and Assemble APK"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Go Environment"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "Setup Java JDK"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Compile Go Daemon & Bundle Flat Files"
        run: |
          go mod tidy
          mkdir -p android/app/src/main/assets

          # 1. Compile Daemon
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o android/app/src/main/assets/aiku-daemon ./cmd/daemon

          # 2. Extract / Copy Binary 'coba' ke Root Assets jika ada di bin/ atau repo root
          if [ -f bin/coba ]; then
            cp bin/coba android/app/src/main/assets/coba
          elif [ -f coba ]; then
            cp coba android/app/src/main/assets/coba
          fi

          # 3. Copy Semua File Config & State Sejajar di Level Root Assets
          [ -f config.yaml ] && cp config.yaml android/app/src/main/assets/ || touch android/app/src/main/assets/config.yaml
          [ -f .env ] && cp .env android/app/src/main/assets/ || touch android/app/src/main/assets/.env
          [ -f state.json ] && cp state.json android/app/src/main/assets/ || echo '{"proxy_state":"ON"}' > android/app/src/main/assets/state.json
          [ -f brain.dat ] && cp brain.dat android/app/src/main/assets/ || touch android/app/src/main/assets/brain.dat

          # 4. Copy Folder blocklists
          if [ -d blocklists ]; then
            cp -r blocklists android/app/src/main/assets/
          else
            mkdir -p android/app/src/main/assets/blocklists
          fi

      - name: "Assemble APK via Gradle"
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: "Upload Installable APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "aiku-service.apk"
          path: android/app/build/outputs/apk/debug/app-debug.apk
