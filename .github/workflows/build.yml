name: "Build Standalone Installable APK"

on:
  push:
    branches:
      - "master"
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
      - "main"

jobs:
  build-apk:
    name: "Compile Go Core and Assemble APK"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Go Environment"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "Setup Java JDK"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Compile Go Daemon & Bundle Assets"
        run: |
          go mod tidy
          mkdir -p android/app/src/main/assets

          # 1. Compile Core Go Daemon
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o android/app/src/main/assets/aiku-daemon ./cmd/daemon

          # 2. Bundle Binary coba
          if [ -f bin/coba ]; then
            cp bin/coba android/app/src/main/assets/coba
          elif [ -f coba ]; then
            cp coba android/app/src/main/assets/coba
          fi

          # 3. Bundle .env, config.yaml, state.json, brain.dat (Pastikan terbuat jika belum ada)
          if [ -f .env ]; then
            cp .env android/app/src/main/assets/.env
          else
            touch android/app/src/main/assets/.env
          fi

          if [ -f config.yaml ]; then
            cp config.yaml android/app/src/main/assets/config.yaml
          else
            touch android/app/src/main/assets/config.yaml
          fi

          if [ -f state.json ]; then
            cp state.json android/app/src/main/assets/state.json
          else
            echo '{"proxy_state":"ON"}' > android/app/src/main/assets/state.json
          fi

          if [ -f brain.dat ]; then
            cp brain.dat android/app/src/main/assets/brain.dat
          else
            touch android/app/src/main/assets/brain.dat
          fi

          # 4. Bundle blocklists directory
          if [ -d blocklists ]; then
            cp -r blocklists android/app/src/main/assets/
          else
            mkdir -p android/app/src/main/assets/blocklists
          fi

      - name: "Assemble APK via Gradle"
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: "Upload Installable APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "aiku-service.apk"
          path: android/app/build/outputs/apk/debug/app-debug.apk
