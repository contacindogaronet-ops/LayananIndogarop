name: "Build Android Native Service Core"

on:
  push:
    branches:
      - "master"
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
      - "main"

jobs:
  build-and-package:
    name: "Build Android Native Core Binaries"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Go Environment"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "Tidy Dependencies"
        run: |
          go mod tidy

      - name: "Build Android APK Core (arm64-v8a & armeabi-v7a)"
        run: |
          mkdir -p dist/apk-assets/arm64-v8a
          mkdir -p dist/apk-assets/armeabi-v7a

          TARGET_PKG="./cmd/daemon"

          # 1. Compile Native Binary for Android 64-bit ARM
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o dist/apk-assets/arm64-v8a/libaiku-daemon.so $TARGET_PKG

          # 2. Compile Native Binary for Android 32-bit ARM
          CGO_ENABLED=0 GOOS=android GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/apk-assets/armeabi-v7a/libaiku-daemon.so $TARGET_PKG

          # 3. Prepare Config Bundle for APK Asset Manager
          mkdir -p dist/apk-assets/common
          [ -f config.yaml ] && cp config.yaml dist/apk-assets/common/ || touch dist/apk-assets/common/config.yaml
          [ -f .env ] && cp .env dist/apk-assets/common/ || touch dist/apk-assets/common/.env
          [ -f state.json ] && cp state.json dist/apk-assets/common/ || touch dist/apk-assets/common/state.json
          [ -f brain.dat ] && cp brain.dat dist/apk-assets/common/ || touch dist/apk-assets/common/brain.dat

          if [ -d blocklists ]; then
            cp -r blocklists dist/apk-assets/common/
          else
            mkdir -p dist/apk-assets/common/blocklists
          fi

      - name: "Compress Bundle for APK Integration"
        run: |
          cd dist
          tar -czvf aiku-daemon-android-service.tar.gz apk-assets/

      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: aiku-daemon-android-service
          path: dist/aiku-daemon-android-service.tar.gz
