name: "Build Standalone Installable APK"

on:
  push:
    branches:
      - "master"
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
      - "main"

jobs:
  build-apk:
    name: "Compile Go Core and Assemble APK"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Go Environment"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "Setup Java JDK"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Compile Go Daemon Binary for Android ARM64"
        run: |
          go mod tidy
          mkdir -p android/app/src/main/assets
          
          # Compile Core Go Daemon as embedded binary inside APK Assets
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o android/app/src/main/assets/aiku-daemon ./cmd/daemon

          # Copy configs & assets
          [ -f config.yaml ] && cp config.yaml android/app/src/main/assets/ || touch android/app/src/main/assets/config.yaml
          [ -f .env ] && cp .env android/app/src/main/assets/ || touch android/app/src/main/assets/.env
          [ -f state.json ] && cp state.json android/app/src/main/assets/ || touch android/app/src/main/assets/state.json
          [ -f brain.dat ] && cp brain.dat android/app/src/main/assets/ || touch android/app/src/main/assets/brain.dat

      - name: "Assemble APK via Gradle"
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: "Upload Installable APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "aiku-service.apk"
          path: android/app/build/outputs/apk/debug/app-debug.apk
