name: Build and Release Autonomous Daemon & APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-daemon:
    name: Build Go Daemon Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true

      - name: Verify and Tidy Go Modules
        run: |
          go mod tidy
          go mod verify

      - name: Build Core Daemon
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/aiku-daemon-linux-arm64 cmd/daemon/main.go
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/aiku-daemon-linux-amd64 cmd/daemon/main.go

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daemon-binaries
          path: dist/*

  build-android:
    name: Build Companion APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew || true
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: companion-apk
          path: android/app/build/outputs/apk/release/*.apk