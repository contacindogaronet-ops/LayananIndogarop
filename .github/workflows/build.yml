name: "Production Release & Auto-Sign APK"

on:
  push:
    branches:
      - "master"
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
      - "main"

jobs:
  build-and-release:
    name: "Build Signed APK & Publish Release"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Go Environment"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "Setup Java JDK"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Generate Keystore for Production Signing"
        run: |
          mkdir -p android/app
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Generating automated release keystore..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias aikukey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass aikusecret \
              -keypass aikusecret \
              -dname "CN=Aiku, OU=Core, O=Aiku, L=Jakarta, ST=ID, C=ID"
          else
            echo "Decoding repository keystore secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          fi

      - name: "Compile Go Daemon & Bundle Assets"
        run: |
          go mod tidy
          mkdir -p android/app/src/main/assets

          # 1. Compile Core Go Daemon untuk arm64
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o android/app/src/main/assets/aiku-daemon ./cmd/daemon

          # 2. Bundle Binary coba
          if [ -f bin/coba ]; then
            cp bin/coba android/app/src/main/assets/coba
          elif [ -f coba ]; then
            cp coba android/app/src/main/assets/coba
          fi

          # 3. Bundle .env via app.env alias (agar tidak diabaikan oleh AAPT)
          if [ -f .env ]; then
            cp .env android/app/src/main/assets/app.env
          else
            touch android/app/src/main/assets/app.env
          fi

          # 4. Bundle assets config & rules
          [ -f config.yaml ] && cp config.yaml android/app/src/main/assets/ || touch android/app/src/main/assets/config.yaml
          [ -f state.json ] && cp state.json android/app/src/main/assets/ || echo '{"proxy_state":"ON"}' > android/app/src/main/assets/state.json
          [ -f brain.dat ] && cp brain.dat android/app/src/main/assets/ || touch android/app/src/main/assets/brain.dat

          if [ -d blocklists ]; then
            cp -r blocklists android/app/src/main/assets/
          else
            mkdir -p android/app/src/main/assets/blocklists
          fi

      - name: "Assemble Signed APK via Gradle"
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_STORE_PASSWORD: "aikusecret"
          KEYSTORE_KEY_ALIAS: "aikukey"
          KEYSTORE_KEY_PASSWORD: "aikusecret"
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "aiku-service-release.apk"
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: "Create GitHub Release (Trigger on Tag or [release] commit)"
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
