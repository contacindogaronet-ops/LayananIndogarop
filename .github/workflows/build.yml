name: "Production Release & Auto-Sign APK"

on:
  push:
    branches:
      - "master"
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
      - "main"

jobs:
  build-and-release:
    name: "Build Signed APK & Auto Versioning"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Go Environment"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "Setup Java JDK"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Prepare Persistent Keystore"
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using user-provided KEYSTORE_BASE64 secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          else
            echo "Generating persistent release keystore..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias aikukey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 20000 \
              -storepass aikurelease2026 \
              -keypass aikurelease2026 \
              -deststoretype PKCS12 \
              -dname "CN=AikuService, OU=NetworkCore, O=Aiku, L=Jakarta, ST=ID, C=ID"
          fi

      - name: "Compile Go Daemon & Bundle Assets"
        run: |
          go mod tidy
          mkdir -p android/app/src/main/assets

          # 1. Compile Core Go Daemon untuk arm64
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o android/app/src/main/assets/aiku-daemon ./cmd/daemon

          # 2. Bundle Binary coba
          if [ -f bin/coba ]; then
            cp bin/coba android/app/src/main/assets/coba
          elif [ -f coba ]; then
            cp coba android/app/src/main/assets/coba
          fi

          # 3. Bundle .env via app.env alias
          if [ -f .env ]; then
            cp .env android/app/src/main/assets/app.env
          else
            touch android/app/src/main/assets/app.env
          fi

          # 4. Bundle assets config & rules
          [ -f config.yaml ] && cp config.yaml android/app/src/main/assets/ || touch android/app/src/main/assets/config.yaml
          [ -f state.json ] && cp state.json android/app/src/main/assets/ || echo '{"proxy_state":"ON"}' > android/app/src/main/assets/state.json
          [ -f brain.dat ] && cp brain.dat android/app/src/main/assets/ || touch android/app/src/main/assets/brain.dat

          if [ -d blocklists ]; then
            cp -r blocklists android/app/src/main/assets/
          else
            mkdir -p android/app/src/main/assets/blocklists
          fi

      - name: "Determine Dynamic Versioning"
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          V_CODE=$((100 + RUN_NUM))
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V_NAME="${GITHUB_REF#refs/tags/v}"
          else
            V_NAME="1.0.${RUN_NUM}"
          fi
          echo "Calculated Version Code: $V_CODE"
          echo "Calculated Version Name: $V_NAME"
          echo "VERSION_CODE=$V_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$V_NAME" >> $GITHUB_ENV

      - name: "Assemble Signed APK via Gradle"
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_STORE_PASSWORD: "aikurelease2026"
          KEYSTORE_KEY_ALIAS: "aikukey"
          KEYSTORE_KEY_PASSWORD: "aikurelease2026"
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "aiku-service-${{ env.VERSION_NAME }}.apk"
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: "Create GitHub Release (Trigger on Tag or [release] commit)"
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: "Release v${{ env.VERSION_NAME }}"
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
